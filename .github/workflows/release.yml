# Publishes the Docker image for a release.
#
# Why this exists: until now every self-hoster built the image themselves,
# which means a Node toolchain, ten minutes and a few gigabytes on the box that
# is supposed to just run a portfolio. A version tag now produces
#
#     ghcr.io/<owner>/open_portfolio:<version>   (and :<major>.<minor>, :latest)
#
# for amd64 and arm64 (a Raspberry Pi is a supported host), with two records
# anybody can check without trusting this repository's word for it:
#
#   - a build provenance attestation, signed through Sigstore with this
#     workflow's own identity — no key to keep or leak. Verify it with
#       gh attestation verify oci://ghcr.io/<owner>/open_portfolio:<version> \
#         --owner <owner>
#   - an SBOM: the list of every package inside the image, attached to it.
#
# Free on public repositories, like the registry itself.

name: Release image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, publish and attest the image
    runs-on: ubuntu-latest
    # arm64 is built under emulation, which is slow; it is also the image the
    # Raspberry Pi people need, so it is not optional.
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write
      # Sigstore signs with the workflow's OIDC identity.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry paths must be lower case; GitHub owner names need not be.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          # `latest` only for a real release tag, never for a manual run.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
