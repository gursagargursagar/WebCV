name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  site:
    name: Marketing site typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # site/ is its own app, deployed by Vercel, but its demo imports the
    # product's core/ — so a change to core/ can break it without touching a
    # file under site/. Installs both trees exactly as the Vercel project's
    # install command does (see site/next.config.ts).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: site

      - name: Typecheck
        run: npm run typecheck
        working-directory: site

      - name: Build (contrast check, then next build)
        run: npm run build
        working-directory: site

  e2e:
    name: Browser tests (golden path, axe, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The production build in a real browser, against an empty store: claim a
    # site, edit it, publish, and check a stranger receives it; axe on the
    # public pages in both modes and on the admin; the guards and headers.
    # Unit tests cover each step; this is what catches the seams between them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run the browser tests
        run: npm run e2e

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  storage-conformance:
    name: Storage conformance against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Supabase and Neon share one SQL engine, so exercising it against a genuine
    # Postgres verifies most of both without needing an account for either.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start PocketBase
        run: |
          curl -sSfL https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/pocketbase_0.40.5_linux_amd64.zip -o /tmp/pb.zip
          unzip -q -o /tmp/pb.zip -d /tmp/pbtest
          /tmp/pbtest/pocketbase superuser upsert test@example.com testtest1234 --dir /tmp/pbdata
          /tmp/pbtest/pocketbase serve --http 127.0.0.1:8090 --dir /tmp/pbdata &
          for i in $(seq 1 30); do
            curl -sSf http://127.0.0.1:8090/api/health && break || sleep 1
          done

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Start Firebase emulators
        run: |
          npx firebase emulators:start --only firestore,storage --project opb-test &
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; do sleep 2; done'
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/9199) 2>/dev/null; do sleep 2; done'

      - name: Start Appwrite
        run: |
          mkdir -p /tmp/awstack
          curl -sSfL https://raw.githubusercontent.com/appwrite/appwrite/2.5.0/docker-compose.yml -o /tmp/awstack/docker-compose.yml
          curl -sSfL https://raw.githubusercontent.com/appwrite/appwrite/2.5.0/.env -o /tmp/awstack/.env
          # Test-only values over the stock template: unprivileged ports and a
          # known secret. Nothing here leaves the runner.
          sed -i 's/^_APP_OPENSSL_KEY_V1=.*/_APP_OPENSSL_KEY_V1=ci-test-secret-key/' /tmp/awstack/.env
          sed -i 's/^_APP_DOMAIN=.*/_APP_DOMAIN=localhost/' /tmp/awstack/.env
          printf '\n_APP_HTTP_PORT=8081\n_APP_HTTPS_PORT=8443\n' >> /tmp/awstack/.env
          cp docker/docker-compose.appwrite.test.yml /tmp/awstack/docker-compose.test.yml
          docker compose -f /tmp/awstack/docker-compose.yml -f /tmp/awstack/docker-compose.test.yml -p opbappwrite up -d
          timeout 300 bash -c 'until curl -sSf http://localhost:8081/v1/health/version >/dev/null 2>&1; do sleep 5; done'

      - name: Bootstrap Appwrite project and key
        run: |
          # Console user, team, project and API key — the same clicks the web
          # installer performs, scripted. A project must belong to a team, and
          # the key id is explicit so this is re-runnable.
          COOKIE_JAR=$(mktemp)
          # /health/version answers before Appwrite's database is ready, so the
          # first writes can return 500 for a few seconds (seen on main). Retry
          # 5xx and refused connections; 409 means the record already exists,
          # which is the state we want. Anything else fails at once.
          aw() {
            for _ in $(seq 1 40); do
              code=$(curl -sS -o /tmp/aw.out -w '%{http_code}' -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
                -H 'X-Appwrite-Project: console' -H 'Content-Type: application/json' \
                -d "$2" "http://localhost:8081/v1$1") || code=000
              case "$code" in
                2??) cat /tmp/aw.out; return 0 ;;
                409) return 0 ;;
                5??|000) sleep 3 ;;
                *) echo "Appwrite $1 answered $code:" >&2; cat /tmp/aw.out >&2; return 1 ;;
              esac
            done
            echo "Appwrite $1 never became ready" >&2
            return 1
          }
          aw /account '{"userId":"ciadmin","email":"ci@test.local","password":"testtest1234","name":"ci"}' >/dev/null
          aw /account/sessions/email '{"email":"ci@test.local","password":"testtest1234"}' >/dev/null
          aw /teams '{"teamId":"opbteam","name":"opbtest"}' >/dev/null
          aw /projects '{"projectId":"opbtest","name":"opbtest","teamId":"opbteam"}' >/dev/null
          SECRET=$(aw /projects/opbtest/keys '{"keyId":"opbtestkey","name":"opb-test","scopes":["databases.read","databases.write","collections.read","collections.write","attributes.read","attributes.write","indexes.read","indexes.write","documents.read","documents.write","files.read","files.write","buckets.read","buckets.write"]}' | jq -r .secret)
          if [ -z "$SECRET" ] || [ "$SECRET" = null ]; then
            echo "Appwrite did not return an API key secret" >&2
            exit 1
          fi
          echo "APPWRITE_TEST_API_KEY=$SECRET" >> "$GITHUB_ENV"

      - name: Run the conformance suite
        run: npm run test
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/opb_test
          TEST_MAILPIT_URL: http://localhost:8025
          POCKETBASE_TEST_URL: http://127.0.0.1:8090
          POCKETBASE_TEST_ADMIN_EMAIL: test@example.com
          POCKETBASE_TEST_ADMIN_PASSWORD: testtest1234
          FIREBASE_TEST_PROJECT: opb-test
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          STORAGE_EMULATOR_HOST: http://127.0.0.1:9199
          APPWRITE_TEST_ENDPOINT: http://localhost:8081/v1
          APPWRITE_TEST_PROJECT_ID: opbtest

  content-safety:
    name: No personal or client-owned content
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a file deleted in a later commit is still in the pack,
          # and a public repo hands out the whole pack.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check working tree
        run: node scripts/check-no-personal-data.mjs

      # The binary rather than the marketplace action: that action requires a
      # licence key for organisation-owned repositories and wants API
      # permissions this workflow deliberately does not grant. Same scan,
      # nothing to configure, and it behaves identically in a fork.
      - name: Scan for committed secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz             | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Nothing here publishes the image — this only proves the Dockerfile is
    # valid, including the explicit miniflare/workerd copies the Cloudflare
    # adapter needs at runtime. Publishing, with a signed build provenance and
    # an SBOM, is release.yml's job, on a version tag.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t open-portfolio:ci .
