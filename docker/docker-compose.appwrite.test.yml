# Test-only override for the Appwrite conformance run.
#
# The conformance suite fires fifty concurrent writes at the API, and each PHP
# worker holds at least one Postgres connection while it serves them. The stock
# limit (100) trips mid-suite and every test after that fails with
# "too many clients" — including tests whose logic is perfectly correct, which
# is exactly how a red suite teaches people to ignore it. 300 fits the burst
# with headroom and changes nothing about the data path.
#
# Used as: docker compose -f docker-compose.yml -f docker-compose.appwrite.test.yml up -d
# (paths as appropriate; see .github/workflows/ci.yml).
services:
  postgresql:
    command: postgres -c max_connections=300
